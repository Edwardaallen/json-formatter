<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON Formatter</title>
<style>
body{font-family:Arial;background:#ecfeff;padding:25px}
main{max-width:750px;margin:auto;background:white;padding:25px;border-radius:15px}
textarea{width:100%;height:220px;box-sizing:border-box;padding:14px;border:1px solid #67e8f9;border-radius:8px}
button{background:#0891b2;color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer;margin:8px 5px 8px 0}
#status{padding:12px;border-radius:8px;background:#cffafe;white-space:pre-wrap}
</style>
</head>
<body>
<main>
<h1>JSON Formatter</h1>
<p>Format, minify and validate JSON data.</p>
<textarea id="input" placeholder='{"name":"John","age":25}'></textarea>
<div>
<button onclick="formatJSON()">Format JSON</button>
<button onclick="minifyJSON()">Minify JSON</button>
<button onclick="clearJSON()">Clear</button>
<button onclick="copyJSON()">Copy Result</button>
</div>
<div id="status">Enter JSON to get started.</div>
</main>
<script>
const input=document.getElementById("input");
const status=document.getElementById("status");
function processJSON(minify){
 try{
  const data=JSON.parse(input.value);
  input.value=minify?JSON.stringify(data):JSON.stringify(data,null,2);
  status.textContent="Valid JSON. Processing successful!";
  status.style.background="#dcfce7";
 }catch(error){
  status.textContent="Invalid JSON: "+error.message;
  status.style.background="#fee2e2";
 }
}
function formatJSON(){processJSON(false);}
function minifyJSON(){processJSON(true);}
function clearJSON(){
 input.value="";
 status.textContent="Enter JSON to get started.";
 status.style.background="#cffafe";
}
async function copyJSON(){
 try{
  await navigator.clipboard.writeText(input.value);
  status.textContent="JSON copied successfully!";
  status.style.background="#dcfce7";
 }catch{
  status.textContent="Please copy the result manually.";
 }
}
</script>
</body>
</html>
