<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Formatter</title>
<style>
body{font-family:Arial;background:#111827;color:white;padding:25px}
main{max-width:750px;margin:auto;background:#1f2937;padding:30px;border-radius:16px}
textarea{width:100%;height:180px;padding:15px;box-sizing:border-box;background:#030712;color:#86efac;border:1px solid #475569;border-radius:8px;font-family:monospace;margin:10px 0}
button{background:#2563eb;color:white;padding:12px 16px;border:0;border-radius:7px;cursor:pointer;margin:4px}
#status{color:#93c5fd}
</style>
</head>
<body>
<main>
<h1>JSON Formatter</h1>
<p>Format and validate JSON directly in your browser.</p>
<textarea id="input" placeholder="Paste your JSON here..."></textarea>
<button onclick="formatJSON(false)">Format JSON</button>
<button onclick="formatJSON(true)">Minify JSON</button>
<button onclick="clearJSON()">Clear</button>
<p id="status"></p>
<textarea id="output" readonly placeholder="Formatted result"></textarea>
<button onclick="copyResult()">Copy Result</button>
</main>
<script>
function formatJSON(minify){
 const input=document.getElementById("input").value;
 const output=document.getElementById("output");
 const status=document.getElementById("status");
 try{
  const data=JSON.parse(input);
  output.value=JSON.stringify(data,null,minify?0:2);
  status.textContent="Valid JSON!";
 }catch(error){
  output.value="";
  status.textContent="Invalid JSON: "+error.message;
 }
}
function clearJSON(){
 document.getElementById("input").value="";
 document.getElementById("output").value="";
 document.getElementById("status").textContent="";
}
async function copyResult(){
 try{
  await navigator.clipboard.writeText(document.getElementById("output").value);
  document.getElementById("status").textContent="Result copied!";
 }catch{
  document.getElementById("status").textContent="Please copy manually.";
 }
}
</script>
</body>
</html>
